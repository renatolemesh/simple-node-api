services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: products-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: products_db
    ports:
      - "27017:27017"
    volumes:
      - ./docker_data/mongodb:/data/db
      #- ./docker_data/mongodb_config:/data/configdb
    networks:
      - shared-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/products_db --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Node.js API Service with Live Reload
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: products-api-live
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=development
      - PORT=3010
      - MONGODB_URI=mongodb://mongodb:27017/products_db
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shared-net
    command: ["npx", "nodemon", "--watch", "src", "--ext", "ts,js,json", "--exec", "npx ts-node src/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  shared-net:
    name: shared-net
    driver: bridge
